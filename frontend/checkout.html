                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"

                </form>
                <hr class="d-block d-md-none">
                <div
                    class="d-flex align-items-center gap-4 justify-content-between flex-row-reverse flex-md-row flex-shrink-0">

                        <a href="/cart.html" class="position-relative">

                        <div id="navLoggedIn" style="display: none;">
                            <div class="d-flex gap-2">
                                <img class="img-thumbnail rounded-circle d-block fillProfileImage" src="img/profile.jpg"
                                    width="40" alt="Profile image">
                                <p class="align-self-center my-0 d-md-none d-lg-block fillName">Profile name</p>
                            </div>
                            <div id="profileCard" class="position-absolute bg-light-subtle end-0 card my-3">

                                    <h5 class="card-title fw-semibold mb-0">Szia, <span class="fillLastName" />!</h5>

    <section class="container">
        <h1>Kassza</h1>
        <hr>
        <div class="row">
            <div class="col-12 col-lg-7">
                <form class="form needsvalidation" id="checkoutForm" novalidate>
                    <!--<div>
                        <h3>Átvételi mód</h3>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="deliveryMethod" id="deliveryMethodStore"
                                required>
                            <label class="form-check-label" for="deliveryMethodStore">
                                Áruházi átvétel
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="deliveryMethod" id="deliveryMethodHome"
                                required>
                            <label class="form-check-label" for="deliveryMethodHome">
                                Házhoz szállítás (+5000 Ft)
                            </label>
                        </div>
                    </div> -->
                    <div class="row mt-3" id="shippingAddress">
                        <h3>Szállítási cím</h3>
                        <div class="col-5 col-sm-4 col-xl-2">
                            <label for="areaCode" class="form-label">Irányítószám</label>
                            <input type="text" class="form-control" id="areaCode" required>
                        </div>
                        <div class="col-7 col-sm-8 col-xl-3">
                            <label for="city" class="form-label">Település</label>
                            <input type="text" class="form-control" id="city" required>
                        </div>
                        <div class="col-9 col-xl-5">
                            <label for="street" class="form-label">Utca</label>
                            <input type="text" class="form-control" id="street" required>
                        </div>
                        <div class="col-3 col-xl-2">
                            <label for="houseNumber" class="form-label">Házszám</label>
                            <input type="text" class="form-control" id="houseNumber" required>
                        </div>
                        <div class="col-12">
                            <label for="additionalAddress" class="form-label">Egyéb információ (nem kötelező)</label>
                            <textarea class="form-control" id="additionalAddress"></textarea>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <h3>Kapcsolati adatok</h3>
                        <div>
                            <label for="email" class="form-label">E-mail cím</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div>
                            <label for="phoneNumber" class="form-label">Telefonszám</label>
                            <input type="tel" class="form-control" id="phoneNumber" required>
                        </div>
                    </div>
                    <div class="row mt-3" id="receiptAddressContainer">
                        <h3>Számlázasi cím</h3>
                        <div class="form-check ms-3">
                            <input class="form-check-input" type="checkbox" id="addressMatchesReceipt">
                            <label class="form-check-label" for="addressMatchesReceipt">
                                Megegyezik a szállítási címmel
                            </label>
                        </div>
                        <div class="col-5 col-sm-4 col-xl-2">
                            <label for="areaCodeReceipt" class="form-label">Irányítószám</label>
                            <input type="text" class="form-control" id="areaCodeReceipt" required>
                        </div>
                        <div class="col-7 col-sm-8 col-xl-3">
                            <label for="cityReceipt" class="form-label">Település</label>
                            <input type="text" class="form-control" id="cityReceipt" required>
                        </div>
                        <div class="col-9 col-xl-5">
                            <label for="streetReceipt" class="form-label">Utca</label>
                            <input type="text" class="form-control" id="streetReceipt" required>
                        </div>
                        <div class="col-3 col-xl-2">
                            <label for="houseNumberReceipt" class="form-label">Házszám</label>
                            <input type="text" class="form-control" id="houseNumberReceipt" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col-12 col-lg-5 mt-5 mt-lg-0">
                <div class="card">
                    <div class="card-header">
                        <h5>Összegzés</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-striped">
                            <tbody id="summaryContainer">
                            </tbody>
                            <tfoot class="table-group-divider">
                                <tr class="table-active">
                                    <td colspan="2">Végösszeg</td>
                                    <td><span id="finalPrice"></span> Ft</td>
                                </tr>
                            </tfoot>
                        </table>
                        <button class="btn btn-primary" id="submitOrder">Rendelés leadása</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-body-tertiary">
        <div class="container">
            <h3>Kevin webshopja</h3>
            <p>Copyright 2026 &copy; Kardos Kevin</p>
        </div>
    </footer>


    <!-- Error toast -->
    <div class="toast align-items-center text-bg-danger border-0 position-fixed bottom-0 start-50 translate-middle-x m-5"
        role="alert" aria-live="assertive" aria-atomic="true" id="errorToast">
        <div class="d-flex">
            <div class="toast-body">
                <span class="fw-bold">Hiba történt!</span>
                <span id="errorToastText"></span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                aria-label="Close"></button>
        </div>
    </div>

    <script type="module" src="src/javascript/index.js"></script>
    <script type="module" src="src/javascript/checkout.js"></script>
