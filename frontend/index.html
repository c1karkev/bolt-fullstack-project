<!doctype html>
<html lang="hu">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webshop</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        .mainPageHeader {
            height: 300px;
        }

        .search {
            max-width: 400px;
        }
    </style>
</head>

<body class="min-vh-100">
    <nav class="navbar navbar-expand-md bg-body-tertiary">
        <div class="container-md">
            <a href="/" class="navbar-brand">Webshop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse gap-3" id="navbarSupportedContent">
                <ul class="navbar-nav mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                </ul>
                <form class="d-flex input-group mx-auto flex-shrink-1 search" role="search">
                    <input class="form-control" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-dark" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
                <div
                    class="d-flex align-items-center gap-4 justify-content-between flex-row-reverse flex-md-row flex-shrink-0">
                    <div class="gap-4 d-flex align-items-center">
                        <a href="#" class="position-relative">
                            <i class="bi bi-basket2-fill fs-5"></i>
                            <span
                                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                                style="font-size: 10px;">
                                99+
                                <span class="visually-hidden">items</span>
                            </span>
                        </a>
                        <a href=""><i class="bi bi-moon-fill fs-5"></i></a>
                        <a href=""><i class="bi bi-gear-fill fs-5"></i></a>
                    </div>
                    <div class="position-relative" id="profile">
                        <a class="d-flex gap-2">
                            <img class="img-thumbnail rounded-circle d-block" width="50" src="https://placehold.co/400"
                                alt="Profile image">
                            <p class="align-self-center my-0 d-md-none d-lg-block">Profile name</p>
                        </a>
                        <div id="profileCard" class="position-absolute bg-light-subtle end-0 card my-3"
                            style="width: 400px; display: none;">
                            <div class="card-body">
                                <h5 class="card-title fw-semibold">Szia, Kevin!</h5>
                            </div>
                            <div class="card-footer d-flex justify-content-end">
                                <button class="btn btn-danger">Kilépés</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <header class="mainPageHeader bg-body-secondary">
        <div class="container d-flex">
            <div class="align-self-center">
                <h1>Kevin webshopja</h1>
                <p>Itt minden terméket a leges legjobb áron találja meg</p>
            </div>
        </div>
    </header>

    <section class="container">
        <h2>Termékek</h2>
        <div>
            <div id="productsContainer" class="row">
                <div class="col-3 mb-4">
                    <div class="card h-100">
                        <img src="https://placehold.co/600x400" class="card-img-top" alt="...">
                        <div class="card-body">
                            <div class="position-absolute top-0 start-0 d-flex gap-1 p-2">
                                <span class="badge rounded-pill bg-primary">Termék tag</span>
                                <span class="badge rounded-pill bg-secondary">Második termék tag</span>
                            </div>
                            <h5 class="card-title">Terméknév</h5>
                            <h6 class="card-subtitle mb-2 text-body-secondary">560 Ft</h6>
                            <a href="#" class="btn btn-primary">További információ</a>
                        </div>
                    </div>
                </div>
            </div>
            <nav aria-label="Page navigation example">
                <ul class="pagination">
                    <li class="page-item disabled"><a class="page-link" href="#"><i
                                class="bi bi-caret-left-fill"></i></a>
                    </li>
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                    <li class="page-item"><a class="page-link" href="#"><i class="bi bi-caret-right-fill"></i></a></li>
                </ul>
            </nav>
        </div>
    </section>

    <footer class="bg-body-tertiary">
        <div class="container">
            <h3>Kevin webshopja</h3>
            <p>Copyright 2026 &copy; Kardos Kevin</p>
        </div>
    </footer>


    <!-- Error toast -->
    <div class="toast align-items-center text-bg-danger border-0 position-fixed bottom-0 start-50 translate-middle-x m-5"
        role="alert" aria-live="assertive" aria-atomic="true" id="errorToast">
        <div class="d-flex">
            <div class="toast-body">
                <span class="fw-bold">Hiba történt!</span>
                <span id="errorToastText"></span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                aria-label="Close"></button>
        </div>
    </div>
</body>

<script>
    const productsContainer = document.getElementById("productsContainer");

    // Error toast
    const errorToast = new bootstrap.Toast(document.getElementById("errorToast"));
    const errorToastText = document.getElementById("errorToastText");

    // Profile
    const profile = document.getElementById("profile");
    const profileCard = document.getElementById("profileCard");
    profile.addEventListener("mouseenter", () => profileCard.style.display = "block");
    profile.addEventListener("mouseleave", () => {
        setTimeout(() => {
            if (!profile.matches(":hover")) {
                profileCard.style.display = "none"
            }
        }, 1000);
    });

    loadPage();

    async function loadPage() {
        // fetch products from backend
        let products = await fetchProducts();
        console.log(products);
        products.forEach(p => {
            productsContainer.innerHTML += generateProductCard(p);
        });
    }

    async function fetchProducts() {
        try {
            const res = await fetch("http://localhost:8000/products/");
            if (res.ok) {
                console.log(res);
                const data = await res.json();
                return data;
            }
        } catch (error) {
            console.log(error);
            showError("A termékek betöltése sikertelen volt.");
        }
        return [];
    }

    function generateProductCard(product) {
        return `<div class="col-3 mb-4">
                    <div class="card h-100">
                        <img src="https://placehold.co/600x400" class="card-img-top" alt="Product image">
                        <div class="card-body">
                            <div class="position-absolute top-0 start-0 d-flex gap-1 p-2">
                                <span class="badge rounded-pill bg-primary">Termék tag</span>
                                <span class="badge rounded-pill bg-secondary">Második termék tag</span>
                            </div>
                            <h5 class="card-title">${product.name}</h5>
                            <h6 class="card-subtitle mb-2 text-body-secondary">${product.price} Ft</h6>
                            <a href="#" class="btn btn-primary">További információ</a>
                        </div>
                    </div>
                </div>`
    }

    function showError(text) {
        errorToastText.innerText = text;
        errorToast.show();
    }
</script>

</html>
