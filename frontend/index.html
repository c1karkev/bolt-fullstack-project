    <!-- Bootstrap Icons -->

    <!-- Local styles-->

    <link rel="stylesheet" href="src/style/index.css">
</head>

<body>
    <nav class="navbar navbar-expand-md sticky-top bg-body-tertiary">
        <div class="container-md">
            <a href="/" class="navbar-brand">Webshop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse gap-3" id="navbarSupportedContent">
                <ul class="navbar-nav mb-2 mb-md-0 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/">Főoldal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/categories.html">Kategóriák</a>

                </ul>
                <form class="d-flex input-group mx-auto flex-shrink-1 search" role="search">
                    <input class="form-control" type="search" placeholder="Keresés" aria-label="Keresés" />
                    <button class="btn btn-dark" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
                <hr class="d-block d-md-none">
                <div
                    class="d-flex align-items-center gap-4 justify-content-between flex-row-reverse flex-md-row flex-shrink-0">

                        <a href="/cart.html" class="position-relative">
                            <i class="bi bi-basket2-fill fs-5 link-body-emphasis"></i>
                            <span
                                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"
                                style="font-size: 10px;" id="cartBadge">

                                <span class="visually-hidden">elem</span>
                            </span>
                        </a>
                        <a href="#" onclick="toggleDarkMode()">
                            <i class="bi bi-moon-fill fs-5 link-body-emphasis"></i>
                        </a>
                        <a href="/settings.html"><i class="bi bi-gear-fill fs-5 link-body-emphasis"></i></a>
                    </div>
                    <div class="position-relative" id="profile">
                        <div id="navLoggedIn" style="display: none;">
                            <div class="d-flex gap-2">
                                <img class="img-thumbnail rounded-circle d-block fillProfileImage" src="img/profile.jpg"
                                    width="40" alt="Profile image">
                                <p class="align-self-center my-0 d-md-none d-lg-block fillName">Profile name</p>
                            </div>
                            <div id="profileCard" class="position-absolute bg-light-subtle end-0 card my-3">
                                <div class="card-body">
                                    <h5 class="card-title fw-semibold mb-0">Szia, <span class="fillLastName" />!</h5>
                                    <p class="small fillEmail m-0"></p>
                                    <hr>
                                    <a href="orders.html">Rendeléseim</a>
                                </div>
                                <div class="card-footer d-flex justify-content-end">
                                    <button class="btn btn-danger logout">Kilépés</button>
                                </div>
                            </div>
                        </div>
                        <div id="navLoggedOut">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="/login.html">
                                    <i class="bi bi-box-arrow-in-right"></i>
                                    <span class="d-inline d-md-none d-lg-inline">Bejelentkezés</span>
                                </a>
                                <button type="button" class="btn btn-primary dropdown-toggle dropdown-toggle-split"
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                    <span class="visually-hidden">Lenyíló menü megnyitása</span>
                                </button>
                                <ul class="dropdown-menu">
                                    <li>
                                        <a class="dropdown-item" href="/login.html?mode=register">
                                            <i class="bi bi-person-fill-add"></i>
                                            Regisztráció
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="mobileProfileNav" class="list-group my-2">
                    <a class="list-group-item w-100" href="/transactions.html">Rendeléseim</a>
                    <a class="list-group-item list-group-item-danger w-100 logout" href="#">Kijelentkezés</a>
                </div>
            </div>
        </div>
    </nav>

    <header class="mainPageHeader bg-body-secondary">
        <div class="container d-flex">
            <div class="align-self-center">
                <h1>Kevin webshopja</h1>
                <p>Itt minden terméket a leges legjobb áron találja meg</p>
            </div>
        </div>
    </header>

    <section class="container">
        <h2>Termékek</h2>
        <div>
            <div id="productsContainer" class="row"></div>
            <nav aria-label="Page navigation example">
                <ul class="pagination">
                    <li class="page-item disabled"><a class="page-link" href="#"><i
                                class="bi bi-caret-left-fill"></i></a>
                    </li>
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                    <li class="page-item"><a class="page-link" href="#"><i class="bi bi-caret-right-fill"></i></a></li>
                </ul>
            </nav>
        </div>
    </section>

    <footer class="bg-body-tertiary">
        <div class="container">
            <h3>Kevin webshopja</h3>
            <p>Copyright 2026 &copy; Kardos Kevin</p>
        </div>
    </footer>


    <!-- Error toast -->
    <div class="toast align-items-center text-bg-danger border-0 position-fixed bottom-0 start-50 translate-middle-x m-5"
        role="alert" aria-live="assertive" aria-atomic="true" id="errorToast">
        <div class="d-flex">
            <div class="toast-body">
                <span class="fw-bold">Hiba történt!</span>
                <span id="errorToastText"></span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                aria-label="Close"></button>
        </div>
    </div>
</body>

<script type="module" src="src/javascript/index.js"></script>
<script type="module">
    import { showError } from "./src/javascript/index.js"
    import * as util from "./src/javascript/util.js"
    import * as auth from "./src/javascript/auth.js"

    const productsContainer = document.getElementById("productsContainer");

    loadPage();

    async function loadPage() {
        // fetch products from backend
        let products = []
        try {
            products = await util.fetchAllProducts();
        } catch (err) {
            console.log(err);
            showError("A termékek betöltése sikertelen volt.");
        }
        console.log(products);
        products.forEach(p => {
            productsContainer.innerHTML += generateProductCard(p);
        });
    }

    function generateProductCard(product) {
        return `<div class="col-12 col-sm-6 col-lg-3 mb-4">
                    <div class="card h-100">
                        <img src="http://localhost:8000/static/img/productImages/${product.imagePath}" class="card-img-top" alt="Product image">
                        <div class="card-body">
                            <div class="position-absolute top-0 start-0 d-flex gap-1 p-2">
                                <span class="badge rounded-pill bg-primary">Termék tag</span>
                                <span class="badge rounded-pill bg-secondary">Második termék tag</span>
                            </div>
                            <h5 class="card-title">${product.name}</h5>
                            <h6 class="card-subtitle mb-2 text-body-secondary">${product.price} Ft</h6>
                            <a href="/product.html?id=${product.id}" class="btn btn-primary">További információ</a>
                        </div>
                    </div>
                </div>`
    }
</script>

</html>
