    <script type="module">
        import * as cart from "./src/javascript/cart.js";
        import { fetchProductById } from "./src/javascript/util.js"

        const cartContainer = document.getElementById("cartContainer");
        const priceSum = document.getElementById("priceSum");

        const cartItems = {};
        for (const [key, value] of Object.entries(cart.getCart())) {
            const item = await fetchProductById(key)
            item.count = value;
            cartItems[key] = item;
        }

        drawTable();

        function drawTable() {
            cartContainer.innerHTML = "";
            let sum = 0;
            for (const [key, value] of Object.entries(cartItems)) {
                cartContainer.innerHTML += createItemRow(key, value.name, value.price, value.count)
                sum += value.count * value.price;
            }
            priceSum.innerText = sum;
        }

        function createItemRow(id, name, price, count) {
            let priceStr = `${price * count} Ft`
            if (count > 1) {
                priceStr += ` (${+price} Ft/db)`;
            }
            return `<tr class="cartItem">
                        <td><a href='/product.html?id="${id}"'>${name}</a></td>
                        <td><input type="number" class="form-control form-control-sm w-auto d-inline" value=${count} min="1" max="99" onchange="updateCount(${id}, this.value)"> db</td>
                        <td>${priceStr}</td>
                        <td><button class="btn btn-sm btn-danger" onclick="remove(${id})"><i class="bi bi-trash3-fill"></i></button></td>
                    </tr>`
        }

        function updateCount(id, count) {
            if (count <= 0) count = 1;
            if (count >= 100) count = 99
            cart.setCartItem(id, count);
            cartItems[id].count = count;
            drawTable();
        }

        function remove(id) {
            cart.setCartItem(id, 0);
            delete cartItems[id];
            drawTable();
        }

        window.updateCount = updateCount;
        window.remove = remove;
    </script>
